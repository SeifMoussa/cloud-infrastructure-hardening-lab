[project]
name = "cloud-infrastructure-hardening-lab"
version = "0.1.0"
description = "Safe local cloud infrastructure hardening lab scaffold for synthetic configurations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "coverage",
    "pytest",
    "pyyaml",
    "ruff",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "pytest",
    "pytest-cov",
    "pyyaml",
    "ruff",
]

[project.scripts]
cloud-hardening-lab = "cloud_hardening_lab.cli:main"

[tool.pytest.ini_options]
addopts = "-v --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
